name: CI & Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Roda todo dia 1º do mês às 09:00 UTC para detectar novas vulnerabilidades/pacotes comprometidos.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-audit:
    name: Lint, Test, Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (high+)
        run: npm audit --audit-level=high
