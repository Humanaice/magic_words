<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: when the on-screen keyboard opens,
      Chrome/Android shrinks the layout instead of covering the game.
      viewport-fit=cover + safe-area insets for phones with notches.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Magic Words: um jogo de digitação onde você ajuda a bruxa Willow a chegar no espaço."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Magic Words</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
